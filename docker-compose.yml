services:
  postgres:
    image: postgres:16-alpine
    container_name: aurabook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurabook
      POSTGRES_PASSWORD: aurabook
      POSTGRES_DB: aurabook
    ports:
      - "5434:5432"
    volumes:
      - aurabook_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurabook -d aurabook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurabook_postgres_data:
